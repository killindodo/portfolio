name: Sync GitHub Repositories

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-repos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Public Repositories from GitHub API
        run: |
          mkdir -p data
          curl -s "https://api.github.com/users/killindodo/repos?sort=updated&per_page=100" > data/github-raw.json
          echo "Repositories fetched successfully."

      - name: Commit and Update Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/github-raw.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-sync latest public github repository metadata" && git push)
